name: Android development build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner image ships the Android SDK. The setup-android action is not used:
      # its default package list still requests the removed `tools` package and fails
      # before any Gradle task runs.
      - name: Check the preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME" || { echo 'No Android SDK on the runner.'; exit 1; }
          echo "Android SDK at $ANDROID_HOME"

      - name: Run the portable tests
        env:
          # The app configuration task needs the authority; without it the task falls back
          # to a local key file that a runner does not have.
          EVILO_PUBLIC_KEY_HEX: ${{ secrets.EVILO_PUBLIC_KEY_HEX }}
        run: ./gradlew :evilo-core:jvmTest :evilo-app:jvmTest --no-daemon --no-configuration-cache

      - name: Build development APK with the preserved official public key
        env:
          EVILO_PUBLIC_KEY_HEX: ${{ secrets.EVILO_PUBLIC_KEY_HEX }}
        run: |
          test -n "$EVILO_PUBLIC_KEY_HEX" || { printf 'Configure repository Secret EVILO_PUBLIC_KEY_HEX; no authority is generated.\n'; exit 1; }
          ./gradlew :evilo-android:assembleDebug --no-daemon --no-configuration-cache --no-build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: android-development
          path: evilo-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
