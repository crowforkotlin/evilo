# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
foojayResolverVersion=1.0.0

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Repository downloads on CI occasionally arrive truncated; retry before failing the build.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
